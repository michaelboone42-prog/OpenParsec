name: OpenParsec iPad fixes

on:
  push:
    branches: [ipad-client-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare patched 1.4.0 source
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/hugeBlack/OpenParsec.git source
          git -C source checkout e516bb64b2023b1989be40626671799b15270e46
          git -C source submodule update --init --recursive
          git -C source apply --check "$GITHUB_WORKSPACE/ipad-client-fixes.patch"
          git -C source apply "$GITHUB_WORKSPACE/ipad-client-fixes.patch"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.4.1" source/OpenParsec/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1401.${{ github.run_number }}" source/OpenParsec/Info.plist
      - name: Build iPad app
        run: |
          set -euo pipefail
          xcodebuild archive -project source/OpenParsec.xcodeproj -scheme OpenParsec \
            -archivePath "$RUNNER_TEMP/OpenParsec.xcarchive" -sdk iphoneos \
            -destination 'generic/platform=iOS' -arch arm64 -configuration Release \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | xcbeautify
      - name: Package for SideStore
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          ditto "$RUNNER_TEMP/OpenParsec.xcarchive/Products/Applications/OpenParsec.app" package/Payload/OpenParsec.app
          app=package/Payload/OpenParsec.app
          find "$app/Frameworks" -type d -name '*.framework' -exec codesign --force --sign - {} \;
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          (cd package && zip -qr ../OpenParsec-1.4.1-ipad-fixes.ipa Payload)
          shasum -a 256 OpenParsec-1.4.1-ipad-fixes.ipa > OpenParsec-1.4.1-ipad-fixes.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OpenParsec-iPad-fixes
          path: |
            OpenParsec-1.4.1-ipad-fixes.ipa
            OpenParsec-1.4.1-ipad-fixes.sha256
            ipad-client-fixes.patch
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenParsec-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
